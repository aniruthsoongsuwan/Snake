<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cyber Neon Snake Arcade</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Orbitron & Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #090a10;
      color: #f3f4f6;
      overflow: hidden;
    }
    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }
    /* Neon Glow Effects */
    .glow-cyan {
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.4), inset 0 0 10px rgba(6, 182, 212, 0.2);
    }
    .glow-magenta {
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.4), inset 0 0 10px rgba(236, 72, 153, 0.2);
    }
    .text-glow-cyan {
      text-shadow: 0 0 10px rgba(6, 182, 212, 0.7);
    }
    .text-glow-gold {
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.8);
    }
    /* Dynamic Screen Shake Effect */
    @keyframes shake {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-8px, 6px); }
      40% { transform: translate(8px, -6px); }
      60% { transform: translate(-5px, 4px); }
      80% { transform: translate(5px, -4px); }
      100% { transform: translate(0, 0); }
    }
    .animate-shake {
      animation: shake 0.35s ease-in-out;
    }
    /* Touch Controls Active Styling */
    .dpad-btn:active {
      transform: scale(0.92);
      background-color: rgba(6, 182, 212, 0.35);
    }
  </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between items-center p-2 sm:p-4 select-none">

  <!-- TOP HEADER HUD -->
  <header class="w-full max-w-lg flex justify-between items-center bg-slate-900/80 border border-slate-800 rounded-2xl p-3 backdrop-blur-md z-10 shadow-lg">
    <div>
      <div class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Score</div>
      <div id="score" class="font-orbitron text-2xl font-bold text-cyan-400 text-glow-cyan">0</div>
    </div>
    
    <div class="flex items-center gap-2">
      <!-- Combo Multiplier Badge -->
      <div id="comboBadge" class="hidden px-2.5 py-1 rounded-full bg-amber-500/20 border border-amber-500/40 text-amber-400 font-orbitron text-xs font-bold animate-pulse">
        x<span id="comboVal">1</span> COMBO
      </div>

      <!-- Mute Toggle -->
      <button id="muteBtn" class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-white hover:bg-slate-700 transition">
        <i id="muteIcon" class="fa-solid fa-volume-high"></i>
      </button>

      <!-- Pause Button -->
      <button id="pauseBtn" class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-white hover:bg-slate-700 transition">
        <i id="pauseIcon" class="fa-solid fa-pause"></i>
      </button>
    </div>

    <div class="text-right">
      <div class="text-xs text-slate-400 font-semibold uppercase tracking-wider">High Score</div>
      <div id="highScore" class="font-orbitron text-2xl font-bold text-pink-500">0</div>
    </div>
  </header>

  <!-- MAIN CANVAS CONTAINER -->
  <main id="gameContainer" class="relative w-full max-w-lg aspect-square my-auto flex items-center justify-center rounded-2xl overflow-hidden border border-cyan-500/30 bg-slate-950/90 shadow-2xl glow-cyan">
    <!-- Game Canvas -->
    <canvas id="gameCanvas" class="w-full h-full block rounded-2xl"></canvas>

    <!-- START / GAMEOVER / PAUSE OVERLAY -->
    <div id="overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20 transition-all duration-300">
      <h1 id="overlayTitle" class="font-orbitron text-3xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500 mb-2">
        CYBER SNAKE
      </h1>
      <p id="overlaySub" class="text-slate-300 text-sm max-w-xs mb-6">
        Swipe or use Arrow Keys to control. Collect neon food, dodge traps & hazards!
      </p>
      
      <!-- High score breakdown on Game Over -->
      <div id="statsBox" class="hidden mb-6 bg-slate-900/90 border border-slate-800 rounded-xl p-4 w-64 text-left">
        <div class="flex justify-between text-sm py-1 border-b border-slate-800 text-slate-300">
          <span>Final Score:</span>
          <span id="finalScore" class="font-orbitron text-cyan-400 font-bold">0</span>
        </div>
        <div class="flex justify-between text-sm py-1 text-slate-300">
          <span>Speed Reached:</span>
          <span id="finalLevel" class="font-orbitron text-pink-400 font-bold">LVL 1</span>
        </div>
      </div>

      <button id="startBtn" class="px-8 py-3.5 rounded-xl font-orbitron font-bold text-slate-950 bg-gradient-to-r from-cyan-400 to-emerald-400 hover:from-cyan-300 hover:to-emerald-300 shadow-lg shadow-cyan-500/30 active:scale-95 transition-transform flex items-center gap-2 text-base">
        <i class="fa-solid fa-play"></i> START GAME
      </button>
    </div>
  </main>

  <!-- VIRTUAL TOUCH D-PAD CONTROLLER (MOBILE OPTIMIZED) -->
  <footer class="w-full max-w-lg mb-2 sm:mb-4 flex flex-col items-center justify-center">
    <!-- Speed/Level Indicator -->
    <div class="w-full flex justify-between items-center px-4 mb-2 text-xs font-orbitron text-slate-400">
      <span>LEVEL: <span id="levelDisplay" class="text-cyan-400">1</span></span>
      <span class="text-slate-500">SWIPE / TOUCH CONTROLS</span>
      <span>HAZARDS: <span id="hazardsDisplay" class="text-pink-400">OFF</span></span>
    </div>

    <!-- On-screen D-Pad Grid -->
    <div class="grid grid-cols-3 gap-2 w-48 h-48 sm:w-52 sm:h-52">
      <div></div>
      <button id="btnUp" class="dpad-btn bg-slate-800/80 border border-cyan-500/30 rounded-2xl flex items-center justify-center text-cyan-400 text-2xl shadow-md active:bg-cyan-500/20">
        <i class="fa-solid fa-caret-up"></i>
      </button>
      <div></div>

      <button id="btnLeft" class="dpad-btn bg-slate-800/80 border border-cyan-500/30 rounded-2xl flex items-center justify-center text-cyan-400 text-2xl shadow-md active:bg-cyan-500/20">
        <i class="fa-solid fa-caret-left"></i>
      </button>
      <div class="bg-slate-900/50 rounded-2xl border border-slate-800/50 flex items-center justify-center text-slate-600 text-xs font-orbitron">
        PAD
      </div>
      <button id="btnRight" class="dpad-btn bg-slate-800/80 border border-cyan-500/30 rounded-2xl flex items-center justify-center text-cyan-400 text-2xl shadow-md active:bg-cyan-500/20">
        <i class="fa-solid fa-caret-right"></i>
      </button>

      <div></div>
      <button id="btnDown" class="dpad-btn bg-slate-800/80 border border-cyan-500/30 rounded-2xl flex items-center justify-center text-cyan-400 text-2xl shadow-md active:bg-cyan-500/20">
        <i class="fa-solid fa-caret-down"></i>
      </button>
      <div></div>
    </div>
  </footer>

  <script>
    /* ===================================================================
       SYNTHETIC WEB AUDIO API SOUND SYSTEM (100% Standalone Offline Audio)
       =================================================================== */
    class SoundEffects {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playEat() {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      }

      playGolden() {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
        osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
        osc.frequency.setValueAtTime(1046.50, now + 0.24); // C6
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(now + 0.35);
      }

      playPoison() {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(150, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(now + 0.2);
      }

      playCrash() {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime;
        // Low bass rumble
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(now + 0.4);
      }

      playLevelUp() {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.25);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(now + 0.25);
      }
    }

    const sound = new SoundEffects();

    /* ===================================================================
       GAME ENGINE & ENGINE STATE
       =================================================================== */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameContainer = document.getElementById('gameContainer');

    // UI Elements
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const startBtn = document.getElementById('startBtn');
    const statsBox = document.getElementById('statsBox');
    const finalScoreEl = document.getElementById('finalScore');
    const finalLevelEl = document.getElementById('finalLevel');
    const levelDisplay = document.getElementById('levelDisplay');
    const hazardsDisplay = document.getElementById('hazardsDisplay');
    const comboBadge = document.getElementById('comboBadge');
    const comboVal = document.getElementById('comboVal');
    const pauseBtn = document.getElementById('pauseBtn');
    const pauseIcon = document.getElementById('pauseIcon');
    const muteBtn = document.getElementById('muteBtn');
    const muteIcon = document.getElementById('muteIcon');

    // Grid Dimensions
    const GRID_SIZE = 20; // 20x20 grid
    let tileSize = 20;

    // Game Variables
    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = null;
    let obstacles = [];
    let particles = [];
    let score = 0;
    let highScore = localStorage.getItem('cyber_snake_highscore') || 0;
    let speed = 130; // initial tick interval in ms
    let gameInterval = null;
    let isRunning = false;
    let isPaused = false;
    let level = 1;
    let combo = 0;
    let comboTimer = null;

    highScoreEl.textContent = highScore;

    // Resize canvas dynamically to match container
    function resizeCanvas() {
      const rect = gameContainer.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      tileSize = canvas.width / GRID_SIZE;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    /* ===================================================================
       FOOD & ITEM SPAWNING (Standard, Golden Star, Poison Berry)
       =================================================================== */
    const FOOD_TYPES = {
      APPLE: { type: 'APPLE', points: 10, color: '#06b6d4', glow: '#22d3ee', chance: 0.70 },
      GOLDEN: { type: 'GOLDEN', points: 30, color: '#f59e0b', glow: '#fbbf24', chance: 0.18 },
      POISON: { type: 'POISON', points: 5, color: '#ec4899', glow: '#f472b6', chance: 0.12 }
    };

    function spawnFood() {
      let valid = false;
      let newPos = {};
      while (!valid) {
        newPos = {
          x: Math.floor(Math.random() * GRID_SIZE),
          y: Math.floor(Math.random() * GRID_SIZE)
        };
        // Check collision with snake
        const hitSnake = snake.some(segment => segment.x === newPos.x && segment.y === newPos.y);
        // Check collision with obstacles
        const hitObstacle = obstacles.some(obs => obs.x === newPos.x && obs.y === newPos.y);
        if (!hitSnake && !hitObstacle) valid = true;
      }

      // Determine food type based on probability
      const rand = Math.random();
      let selectedType = FOOD_TYPES.APPLE;
      if (rand > FOOD_TYPES.APPLE.chance + FOOD_TYPES.GOLDEN.chance) {
        selectedType = FOOD_TYPES.POISON;
      } else if (rand > FOOD_TYPES.APPLE.chance) {
        selectedType = FOOD_TYPES.GOLDEN;
      }

      food = { ...newPos, ...selectedType };
    }

    /* ===================================================================
       DYNAMIC OBSTACLE / HAZARD GENERATOR
       =================================================================== */
    function updateObstacles() {
      obstacles = [];
      // Only add obstacles starting from level 3
      if (level < 3) {
        hazardsDisplay.textContent = "OFF";
        hazardsDisplay.className = "text-pink-400";
        return;
      }
      hazardsDisplay.textContent = "ACTIVE";
      hazardsDisplay.className = "text-pink-500 animate-pulse font-bold";

      const obstacleCount = Math.min(level - 2, 6); // Max 6 obstacle blocks
      for (let i = 0; i < obstacleCount; i++) {
        let valid = false;
        let obs = {};
        while (!valid) {
          obs = {
            x: Math.floor(Math.random() * (GRID_SIZE - 4)) + 2,
            y: Math.floor(Math.random() * (GRID_SIZE - 4)) + 2
          };
          const hitSnake = snake.some(s => Math.abs(s.x - obs.x) < 2 && Math.abs(s.y - obs.y) < 2);
          const hitFood = food && food.x === obs.x && food.y === obs.y;
          const hitOther = obstacles.some(o => o.x === obs.x && o.y === obs.y);
          if (!hitSnake && !hitFood && !hitOther) valid = true;
        }
        obstacles.push(obs);
      }
    }

    /* ===================================================================
       PARTICLE SYSTEM (Explosion effects when eating food)
       =================================================================== */
    function createParticles(x, y, color) {
      const count = 12;
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1;
        particles.push({
          x: (x + 0.5) * tileSize,
          y: (y + 0.5) * tileSize,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 3 + 1.5,
          color: color,
          alpha: 1,
          decay: Math.random() * 0.04 + 0.02
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    /* ===================================================================
       GAME LOOP & LOGIC
       =================================================================== */
    function resetGame() {
      snake = [
        { x: 5, y: 10 },
        { x: 4, y: 10 },
        { x: 3, y: 10 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      level = 1;
      speed = 130;
      combo = 0;
      scoreEl.textContent = score;
      levelDisplay.textContent = level;
      comboBadge.classList.add('hidden');
      particles = [];
      updateObstacles();
      spawnFood();
    }

    function startGame() {
      sound.init();
      resetGame();
      overlay.classList.add('opacity-0', 'pointer-events-none');
      isRunning = true;
      isPaused = false;
      pauseIcon.className = "fa-solid fa-pause";
      clearInterval(gameInterval);
      gameInterval = setInterval(gameTick, speed);
    }

    function gameOver() {
      sound.playCrash();
      isRunning = false;
      clearInterval(gameInterval);

      // Screen shake animation
      gameContainer.classList.add('animate-shake');
      setTimeout(() => gameContainer.classList.remove('animate-shake'), 400);

      // Save high score
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('cyber_snake_highscore', highScore);
        highScoreEl.textContent = highScore;
      }

      // Show stats on overlay
      overlayTitle.textContent = "GAME OVER";
      overlaySub.textContent = score >= highScore && score > 0 ? "NEW HIGH SCORE!" : "Defeated by cyber hazards!";
      finalScoreEl.textContent = score;
      finalLevelEl.textContent = `LVL ${level}`;
      statsBox.classList.remove('hidden');
      startBtn.innerHTML = `<i class="fa-solid fa-rotate-right"></i> PLAY AGAIN`;
      overlay.classList.remove('opacity-0', 'pointer-events-none');
    }

    function togglePause() {
      if (!isRunning) return;
      isPaused = !isPaused;
      if (isPaused) {
        clearInterval(gameInterval);
        pauseIcon.className = "fa-solid fa-play";
        overlayTitle.textContent = "PAUSED";
        overlaySub.textContent = "Take a break. Tap resume when ready!";
        statsBox.classList.add('hidden');
        startBtn.innerHTML = `<i class="fa-solid fa-play"></i> RESUME`;
        overlay.classList.remove('opacity-0', 'pointer-events-none');
      } else {
        overlay.classList.add('opacity-0', 'pointer-events-none');
        pauseIcon.className = "fa-solid fa-pause";
        gameInterval = setInterval(gameTick, speed);
      }
    }

    function gameTick() {
      dir = { ...nextDir };
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall Collision Test
      if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
        return gameOver();
      }

      // Self Collision Test
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        return gameOver();
      }

      // Obstacle Collision Test
      if (obstacles.some(obs => obs.x === head.x && obs.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      // Food Eating Logic
      if (food && head.x === food.x && head.y === food.y) {
        // Handle Combo
        combo++;
        if (comboTimer) clearTimeout(comboTimer);
        comboTimer = setTimeout(() => {
          combo = 0;
          comboBadge.classList.add('hidden');
        }, 3000);

        if (combo > 1) {
          comboVal.textContent = combo;
          comboBadge.classList.remove('hidden');
        }

        // Add Score with Combo Multiplier
        const earnedPoints = food.points * (1 + (combo - 1) * 0.5);
        score += Math.round(earnedPoints);
        scoreEl.textContent = score;

        // Visual Explosion Particles
        createParticles(food.x, food.y, food.glow);

        // Sound Effects & Special Food Effects
        if (food.type === 'GOLDEN') {
          sound.playGolden();
        } else if (food.type === 'POISON') {
          sound.playPoison();
          // Shrink snake tail slightly if poisoned (minimum length 3)
          if (snake.length > 4) {
            snake.pop();
            snake.pop();
          }
        } else {
          sound.playEat();
        }

        // Progressive Difficulty & Leveling System
        const newLevel = Math.floor(score / 50) + 1;
        if (newLevel !== level) {
          level = newLevel;
          levelDisplay.textContent = level;
          sound.playLevelUp();
          // Speed acceleration capped at minimum 55ms
          speed = Math.max(55, 130 - (level - 1) * 10);
          clearInterval(gameInterval);
          gameInterval = setInterval(gameTick, speed);
          updateObstacles();
        }

        spawnFood();
      } else {
        snake.pop(); // Normal move, remove tail segment
      }

      render();
    }

    /* ===================================================================
       CANVAS RENDERING ENGINE (Neon Futuristic Graphics)
       =================================================================== */
    function render() {
      // Clear Canvas
      ctx.fillStyle = '#090a10';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Render Grid Lines (Cyber Background)
      ctx.strokeStyle = 'rgba(30, 41, 59, 0.4)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(i * tileSize, 0);
        ctx.lineTo(i * tileSize, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * tileSize);
        ctx.lineTo(canvas.width, i * tileSize);
        ctx.stroke();
      }

      // Render Obstacles (Wall Blocks)
      obstacles.forEach(obs => {
        ctx.save();
        ctx.fillStyle = '#f43f5e';
        ctx.shadowColor = '#f43f5e';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.roundRect(
          obs.x * tileSize + 2,
          obs.y * tileSize + 2,
          tileSize - 4,
          tileSize - 4,
          6
        );
        ctx.fill();
        // Inner X symbol for danger aesthetic
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(obs.x * tileSize + 6, obs.y * tileSize + 6);
        ctx.lineTo((obs.x + 1) * tileSize - 6, (obs.y + 1) * tileSize - 6);
        ctx.moveTo((obs.x + 1) * tileSize - 6, obs.y * tileSize + 6);
        ctx.lineTo(obs.x * tileSize + 6, (obs.y + 1) * tileSize - 6);
        ctx.stroke();
        ctx.restore();
      });

      // Render Food Item
      if (food) {
        ctx.save();
        ctx.fillStyle = food.color;
        ctx.shadowColor = food.glow;
        ctx.shadowBlur = 15;
        
        const centerX = (food.x + 0.5) * tileSize;
        const centerY = (food.y + 0.5) * tileSize;
        const radius = (tileSize / 2) - 2;

        ctx.beginPath();
        if (food.type === 'GOLDEN') {
          // Render Pulsing Star shape for bonus food
          const pulses = Math.sin(Date.now() / 150) * 1.5;
          ctx.arc(centerX, centerY, radius + pulses, 0, Math.PI * 2);
        } else if (food.type === 'POISON') {
          // Render Diamond for poison
          ctx.rect(centerX - radius + 2, centerY - radius + 2, (radius - 2) * 2, (radius - 2) * 2);
        } else {
          // Standard Glowing Orb
          ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        }
        ctx.fill();
        ctx.restore();
      }

      // Render Snake
      snake.forEach((segment, index) => {
        ctx.save();
        const isHead = index === 0;

        if (isHead) {
          ctx.fillStyle = '#38bdf8';
          ctx.shadowColor = '#06b6d4';
          ctx.shadowBlur = 15;
        } else {
          // Gradient tail fading out
          const alpha = 1 - (index / snake.length) * 0.6;
          ctx.fillStyle = `rgba(14, 165, 233, ${alpha})`;
          ctx.shadowColor = '#0284c7';
          ctx.shadowBlur = 6;
        }

        ctx.beginPath();
        ctx.roundRect(
          segment.x * tileSize + 1.5,
          segment.y * tileSize + 1.5,
          tileSize - 3,
          tileSize - 3,
          isHead ? 8 : 5
        );
        ctx.fill();

        // Draw Snake Head Eyes
        if (isHead) {
          ctx.fillStyle = '#090a10';
          const eyeSize = tileSize / 5;
          let eyeX1, eyeY1, eyeX2, eyeY2;

          if (dir.x === 1) { // Right
            eyeX1 = eyeX2 = (segment.x + 0.75) * tileSize;
            eyeY1 = (segment.y + 0.3) * tileSize;
            eyeY2 = (segment.y + 0.7) * tileSize;
          } else if (dir.x === -1) { // Left
            eyeX1 = eyeX2 = (segment.x + 0.25) * tileSize;
            eyeY1 = (segment.y + 0.3) * tileSize;
            eyeY2 = (segment.y + 0.7) * tileSize;
          } else if (dir.y === -1) { // Up
            eyeY1 = eyeY2 = (segment.y + 0.25) * tileSize;
            eyeX1 = (segment.x + 0.3) * tileSize;
            eyeX2 = (segment.x + 0.7) * tileSize;
          } else { // Down
            eyeY1 = eyeY2 = (segment.y + 0.75) * tileSize;
            eyeX1 = (segment.x + 0.3) * tileSize;
            eyeX2 = (segment.x + 0.7) * tileSize;
          }

          ctx.beginPath();
          ctx.arc(eyeX1, eyeY1, eyeSize, 0, Math.PI * 2);
          ctx.arc(eyeX2, eyeY2, eyeSize, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });

      // Update & Draw Particles
      updateParticles();
      drawParticles();
    }

    /* ===================================================================
       CONTROLS (TOUCH D-PAD, SWIPE GESTURES & KEYBOARD)
       =================================================================== */
    function setDirection(dx, dy) {
      // Prevent 180 degree instant reversal
      if (dx === -dir.x && dy === -dir.y) return;
      nextDir = { x: dx, y: dy };
    }

    // Keyboard Input (Desktop)
    window.addEventListener('keydown', e => {
      switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          setDirection(0, -1);
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          setDirection(0, 1);
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          setDirection(-1, 0);
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          setDirection(1, 0);
          break;
        case ' ':
          togglePause();
          break;
      }
    });

    // On-screen Virtual D-Pad Touch Listeners
    document.getElementById('btnUp').addEventListener('touchstart', e => { e.preventDefault(); setDirection(0, -1); });
    document.getElementById('btnDown').addEventListener('touchstart', e => { e.preventDefault(); setDirection(0, 1); });
    document.getElementById('btnLeft').addEventListener('touchstart', e => { e.preventDefault(); setDirection(-1, 0); });
    document.getElementById('btnRight').addEventListener('touchstart', e => { e.preventDefault(); setDirection(1, 0); });

    document.getElementById('btnUp').addEventListener('click', () => setDirection(0, -1));
    document.getElementById('btnDown').addEventListener('click', () => setDirection(0, 1));
    document.getElementById('btnLeft').addEventListener('click', () => setDirection(-1, 0));
    document.getElementById('btnRight').addEventListener('click', () => setDirection(1, 0));

    // Touch Swipe Controls directly on Game Canvas (Mobile Gestures)
    let touchStartX = 0;
    let touchStartY = 0;

    gameContainer.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    gameContainer.addEventListener('touchend', e => {
      if (!isRunning || isPaused) return;
      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;
      
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;
      const minSwipeDistance = 25; // Minimum threshold px

      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (Math.abs(diffX) > minSwipeDistance) {
          if (diffX > 0) setDirection(1, 0);  // Right
          else setDirection(-1, 0);           // Left
        }
      } else {
        if (Math.abs(diffY) > minSwipeDistance) {
          if (diffY > 0) setDirection(0, 1);  // Down
          else setDirection(0, -1);           // Up
        }
      }
    }, { passive: true });

    // UI Buttons Action Listeners
    startBtn.addEventListener('click', () => {
      if (isPaused) {
        togglePause();
      } else {
        startGame();
      }
    });

    pauseBtn.addEventListener('click', togglePause);

    muteBtn.addEventListener('click', () => {
      sound.muted = !sound.muted;
      muteIcon.className = sound.muted ? "fa-solid fa-volume-xmark text-pink-500" : "fa-solid fa-volume-high text-slate-300";
    });

    // Initial render on load
    render();
  </script>
</body>
</html>
